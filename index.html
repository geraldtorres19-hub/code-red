<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Code Red Competency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<style>
/* Layout: staff flow = one narrow glass card per step; Master console = glass dashboard grid over a slow aurora of ember red and deep teal. */
:root{
  --ink:#060a13; --ink2:#0c1324; --text:#eef2fb; --muted:#97a3bd;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --line:rgba(255,255,255,.13);
  --ember:#ff4a3a; --ember2:#ff8a5a; --jade:#38e0a0; --amber:#ffc45c; --sky:#62b5ff;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#0f1a33 0%,var(--ink) 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#ff3b2a;opacity:.38}
.aurora i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;bottom:-10vmax;background:#0fa59b;animation-duration:32s;opacity:.34}
.aurora i:nth-child(3){width:26vmax;height:26vmax;left:38%;top:42%;background:#2b4fff;opacity:.16;animation-duration:38s}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}
a{color:var(--sky)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.narrow{max-width:600px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 0 rgba(255,74,58,.6);animation:pulse 1.8s infinite}
.brand small{display:block;font:500 11px var(--body);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(255,74,58,0)}100%{box-shadow:0 0 0 0 rgba(255,74,58,0)}}
.glass{background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:0 18px 50px -22px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);padding:20px;position:relative;min-width:0}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn{font:600 15px var(--body);border:0;border-radius:14px;padding:13px 20px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--ember),var(--ember2));box-shadow:0 10px 26px -10px rgba(255,74,58,.8);transition:transform .15s,filter .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;color:var(--text)}
.btn.jade{background:linear-gradient(135deg,#1fbf86,var(--jade));color:#04281c;box-shadow:0 10px 26px -12px rgba(56,224,160,.8)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px}
.btn.danger{background:rgba(255,74,58,.14);border:1px solid rgba(255,74,58,.5);box-shadow:none;color:#ffb3aa}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
input,select,textarea{width:100%;font:500 15px var(--body);color:var(--text);background:rgba(4,8,18,.55);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0}
input::placeholder{color:#5d6985}
select option{background:#0c1324;color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{min-width:0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--glass)}
.chip.ok{color:var(--jade);border-color:rgba(56,224,160,.4);background:rgba(56,224,160,.1)}
.chip.warn{color:var(--amber);border-color:rgba(255,196,92,.4);background:rgba(255,196,92,.1)}
.chip.bad{color:#ff8f84;border-color:rgba(255,74,58,.45);background:rgba(255,74,58,.12)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.hero h1{font-size:clamp(40px,9vw,64px);font-weight:800;line-height:.98}
.hero h1 em{font-style:normal;color:var(--ember);text-shadow:0 0 40px rgba(255,74,58,.55)}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line)}
.steps span b{color:var(--ember2);margin-right:5px}
.prog{height:8px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.prog>i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--ember),var(--amber));transition:width .5s cubic-bezier(.2,.7,.2,1)}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:14px 15px;border-radius:15px;border:1px solid var(--line);
  background:var(--glass);color:var(--text);font:500 15px/1.4 var(--body);cursor:pointer;transition:.15s}
.opt:hover{background:var(--glass2);transform:translateX(2px)}
.opt .k{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 13px var(--mono);background:rgba(255,255,255,.09)}
.opt.sel{border-color:var(--ember2);background:rgba(255,74,58,.13)}
.opt.sel .k{background:var(--ember);color:#fff}
.qtext{font:700 clamp(19px,4.6vw,24px)/1.3 var(--display);letter-spacing:-.01em}
.slide{min-height:220px;display:flex;flex-direction:column;gap:12px}
.slide h2{font-size:clamp(24px,5.5vw,32px)}
.slide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.slide .letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slide .letters div{background:rgba(255,74,58,.1);border:1px solid rgba(255,74,58,.3);border-radius:14px;padding:12px 8px;text-align:center;font-size:13px}
.slide .letters b{display:block;font:800 30px var(--display);color:var(--ember2)}
.note{font-size:13px;color:var(--amber);background:rgba(255,196,92,.08);border:1px solid rgba(255,196,92,.25);border-radius:12px;padding:10px 12px}
.video{aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.video iframe,.video video{width:100%;height:100%;border:0}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.2);transition:.25s}
.dots i.on{width:22px;background:var(--ember2)}
.bignum{font:800 clamp(54px,16vw,84px)/1 var(--display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:9px 15px;border-radius:12px;cursor:pointer}
.tabs button.on{background:var(--glass2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.kpi{overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.09) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s}
.kpi:hover::after{transform:translateX(120%)}
.kpi .v{font:800 40px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .s{font-size:13px;color:var(--muted);margin-top:4px}
.dgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.glass h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.glass h3 small{font:500 12px var(--body);color:var(--muted)}
.hbar{display:grid;grid-template-columns:minmax(78px,130px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hbar .t{display:flex;height:12px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.08)}
.hbar .t i{display:block;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feed{display:flex;flex-direction:column;gap:10px;max-height:330px;overflow:auto}
.feed div{display:flex;gap:10px;align-items:center;font-size:13px}
.feed div i{flex:none;width:9px;height:9px;border-radius:50%}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:860px}
table.t th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:11px 12px;background:rgba(8,12,24,.85)}
table.t td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
table.t tr:hover td{background:rgba(255,255,255,.04)}
.empty{text-align:center;padding:34px 14px;color:var(--muted)}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(3,6,14,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:60;
  background:#101a30;border:1px solid var(--line);padding:11px 18px;border-radius:14px;font-weight:600;transition:.3s;pointer-events:none;max-width:92vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ring text{font-family:var(--display)}
.check{width:84px;height:84px}
.check circle{stroke-dasharray:252;stroke-dashoffset:252;animation:dash .8s .1s forwards}
.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:dash .5s .8s forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.paperwrap{overflow:hidden;border-radius:10px}
.paper{transform-origin:top left;background:#fff;color:#111;box-shadow:0 20px 60px rgba(0,0,0,.5)}
/* ---------- A4 documents ---------- */
.paper{font:8.2pt/1.22 Arial,Helvetica,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper.form{width:210mm;min-height:297mm;padding:9mm 11mm}
.paper.cert{width:297mm;height:210mm;padding:9mm}
.paper.list{width:297mm;min-height:210mm;padding:10mm}
.paper table{border-collapse:collapse;width:100%}
.paper td,.paper th{border:1px solid #222;padding:2px 4px;vertical-align:middle}
.paper .hd{display:flex;align-items:center;gap:10px;border-bottom:3px solid #1d3f8a;padding-bottom:5px;margin-bottom:5px}
.paper .hd img{height:15mm;max-width:46mm;object-fit:contain}
.paper .hd .mk{font:700 11pt Arial;color:#1d3f8a;line-height:1.1}
.paper .ti{text-align:center;font-weight:700;font-size:11pt;margin:3px 0}
.paper .sec th{background:#eef1f7;text-align:left;font-size:9pt}
.paper .ac{text-align:center;width:6.2mm;font-weight:700}
.paper .acs{color:#0a6b3d}.paper .acu{color:#b3261e}
.paper .sm{font-size:7pt}
.paper .ctl{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:6px;font-size:7.5pt}
.paper .qrb{width:19mm;height:19mm}
.paper .qrb img,.paper .qrb canvas{width:100%!important;height:100%!important}
  background:radial-gradient(circle at 50% 0,#f3f6ff,#fff 60%)}
#printHost{display:none}
@media print{
  body{background:#fff!important;padding:0!important}
  .aurora,#app,#toast,#modal{display:none!important}
  #printHost{display:block!important}
  #printHost .paper{transform:none!important;box-shadow:none!important;margin:0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* ---------- v2 additions ---------- */
[dir=rtl] .opt{text-align:right}
[dir=rtl] .opt:hover{transform:translateX(-2px)}
[dir=rtl] .slide ul{padding-left:0;padding-right:20px}
[dir=rtl] .hero h1{letter-spacing:0}
.rtlfont{font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,system-ui,sans-serif}
.urfont{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;line-height:2}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--glass);color:var(--text);font:600 13px var(--body);padding:6px 12px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--ember);border-color:var(--ember);color:#fff}
.hist{display:flex;flex-direction:column;gap:10px}
.hist .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass)}
.hist .h .grow{min-width:140px}
.ans{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.ans span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.ans .y{background:rgba(56,224,160,.12);color:var(--jade)}.ans .n{background:rgba(255,74,58,.14);color:#ff9a8f}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;text-transform:none;letter-spacing:0;margin:5px 0;color:var(--text);font-weight:500}
.chk input{width:auto;margin-top:3px}
.mini{font-size:12px}
/* ---------- A4 certificate (landscape), centred and balanced ---------- */
.paper.cert{width:297mm;height:210mm;padding:7mm;font-family:Georgia,'Times New Roman',serif}
.cert .frame{height:100%;border:1.6mm solid #1d3f8a;outline:.5mm solid #c3a24a;outline-offset:-3.4mm;padding:9mm 16mm 8mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;position:relative;
  background:radial-gradient(circle at 50% 38%,#fff 0,#f6f8fd 70%,#eef2fb 100%)}
.cert .frame::before,.cert .frame::after{content:"";position:absolute;width:20mm;height:20mm;border:.6mm solid #c3a24a}
.cert .frame::before{top:5mm;left:5mm;border-right:0;border-bottom:0}.cert .frame::after{bottom:5mm;right:5mm;border-left:0;border-top:0}
.cert .ch{display:flex;flex-direction:column;align-items:center;gap:2mm}
.cert .ch img{height:22mm;max-width:70mm;object-fit:contain}
.cert .hn{font:700 15pt Arial,sans-serif;color:#1d3f8a;letter-spacing:.02em}
.cert .hs{font:500 9.5pt Arial,sans-serif;color:#555;letter-spacing:.14em;text-transform:uppercase}
.cert .t1{font:700 40pt Georgia,serif;letter-spacing:.22em;color:#1d3f8a;line-height:1}
.cert .t2{font:700 12.5pt Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#b3261e;margin-top:2.5mm}
.cert .rule{width:70mm;height:.5mm;background:linear-gradient(90deg,transparent,#c3a24a,transparent);margin:3mm auto}
.cert .nm{font:italic 500 36pt Georgia,serif;color:#111;border-bottom:.35mm solid #444;padding:0 14mm 1.5mm;margin:2mm 0}
.cert p{margin:1.4mm 0;font-size:12.5pt;line-height:1.45;max-width:230mm;color:#222}
.cert .mid{display:flex;flex-direction:column;align-items:center}
.cert .ft{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8mm;font:9.5pt Arial,sans-serif}
.cert .sg{justify-self:start;width:68mm;border-top:.3mm solid #333;padding-top:1.5mm;text-align:center}
.cert .qc{display:flex;flex-direction:column;align-items:center;gap:1.5mm}
.cert .qrb{width:25mm;height:25mm}
.cert .ct{justify-self:end;text-align:center;width:68mm;border-top:.3mm solid #333;padding-top:1.5mm}
.cert .seal{position:absolute;right:20mm;top:44mm;width:28mm;height:28mm;border-radius:50%;border:.6mm solid #c3a24a;display:grid;place-items:center;color:#c3a24a;font:700 8pt Arial;text-align:center;line-height:1.2;transform:rotate(-12deg);opacity:.85}
/* ---------- compliance report (A4 portrait pages) ---------- */
.paper.rep{width:210mm;height:297mm;padding:8mm 9mm;overflow:hidden;font:8pt/1.25 Arial,Helvetica,sans-serif;position:relative}
.rep .in{transform-origin:top left}
.rep h1{font:700 14pt Arial;color:#1d3f8a;margin:2mm 0 0}
.rep .sub{color:#555;font-size:8pt;margin-bottom:2mm}
.rep .kp{display:grid;grid-template-columns:repeat(6,1fr);gap:2mm;margin:2mm 0}
.rep .kp div{border:.3mm solid #1d3f8a;border-radius:1.5mm;padding:1.5mm 2mm;text-align:center}
.rep .kp b{display:block;font:700 15pt Arial}
.rep .kp span{font-size:6.5pt;text-transform:uppercase;letter-spacing:.04em;color:#444}
.rep .two{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin:2mm 0}
.rep h2{font:700 9pt Arial;margin:2mm 0 1mm;color:#1d3f8a}
.rep table{border-collapse:collapse;width:100%}
.rep th,.rep td{border:.2mm solid #444;padding:.7mm 1.4mm}
.rep th{background:#e9eef8;text-align:left;font-size:7pt}
.rep td.n,.rep th.n{text-align:right;font-variant-numeric:tabular-nums}
.rep tr.tot td{font-weight:700;background:#f2f4f8}
.rep .g{color:#0a6b3d;font-weight:700}.rep .o{color:#a35b00;font-weight:700}.rep .r{color:#b3261e;font-weight:700}
.rep .ft{position:absolute;left:9mm;right:9mm;bottom:5mm;font-size:6.5pt;color:#666;display:flex;justify-content:space-between}
@media print{#printHost .paper.rep{page-break-after:always;break-after:page}#printHost .paper.rep:last-child{page-break-after:auto}}

</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div id="app"></div>
<div id="modal"></div>
<div id="printHost"></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
var BACKEND_URL='https://script.google.com/macros/s/AKfycbw2djtA22HxK2hp-2sOG-qQdAigGEdGvaVNbEcEK1Wo_jbnPDaPsLn5xocRnHwmm5V6QQ/exec';

  rowMenu:function(t){ var r=findRec(t.dataset.id), id=esc(r.id); openModal('<h2 style="font-size:20px;margin-bottom:6px">'+esc(r.name)+'</h2><p class="muted" style="margin-top:0">ID '+id+' · '+esc(r.dept)+' / '+esc(r.unit)+'</p><div class="row"><button class="btn ghost" data-act="editOpen" data-id="'+id+'">Edit details</button><button class="btn ghost" data-act="newCycleAsk" data-id="'+id+'">Allow new attempts / early retest</button>'+(r.temp?'<button class="btn ghost" data-act="convOpen" data-id="'+id+'">Convert temporary ID</button>':'')+'<button class="btn ghost" data-act="toggleActive" data-id="'+id+'">'+(r.active===false?'Mark active':'Mark inactive (left the hospital)')+'</button><button class="btn danger" data-act="delAsk" data-id="'+id+'">Delete record</button><button class="btn ghost" data-act="mclose">Close</button></div>'); },
  editOpen:function(t){ var r=findRec(t.dataset.id); openModal('<h2 style="font-size:20px;margin-bottom:10px">Edit details</h2><div class="grid2"><div class="field" style="grid-column:1/-1"><label for="e_name">Name</label><input id="e_name" value="'+esc(r.name)+'"></div><div class="field"><label for="e_dept">Department</label><input id="e_dept" value="'+esc(r.dept)+'"></div><div class="field"><label for="e_unit">Unit</label><input id="e_unit" value="'+esc(r.unit)+'"></div><div class="field" style="grid-column:1/-1"><label for="e_pos">Position</label><input id="e_pos" value="'+esc(r.pos||'')+'"></div></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-act="mclose">Cancel</button><button class="btn" data-act="editSave" data-id="'+esc(r.id)+'">Save</button></div>'); },
  editSave:function(t){ mcall({a:'m_edit',id:t.dataset.id,name:$('#e_name').value,dept:$('#e_dept').value,unit:$('#e_unit').value,pos:$('#e_pos').value},'Saved.'); },
  newCycleAsk:function(t){ confirmBox('Open a new assessment cycle for this person (3 new attempts)? The old results and certificates stay in their history.','doNewCycle',t.dataset.id); },
  doNewCycle:function(t){ mcall({a:'m_newcycle',id:t.dataset.id},'New cycle opened.'); },
  toggleActive:function(t){ var r=findRec(t.dataset.id); mcall({a:'m_active',id:t.dataset.id,active:r.active===false},'Updated.'); },
  delAsk:function(t){ confirmBox('Delete this record and its whole history permanently?','doDel',t.dataset.id); },
  doDel:function(t){ mcall({a:'m_del',id:t.dataset.id},'Deleted.'); },
  convOpen:function(t){ var r=findRec(t.dataset.id); openModal('<h2 style="font-size:20px;margin-bottom:6px">Convert temporary number</h2><p class="muted" style="margin-top:0">'+esc(r.name)+' · '+esc(r.id)+'</p><div class="field"><label for="c_id">Official staff ID</label><input id="c_id" maxlength="20"></div><p class="muted mini">All history and certificates move to the new ID. The temporary number keeps working for the staff member and for certificate verification.</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="mclose">Cancel</button><button class="btn jade" data-act="convSave" data-id="'+esc(r.id)+'">Convert</button></div>'); },
  convSave:function(t){ var n=$('#c_id').value.trim(); if(!n) return toast('Enter the official ID.'); mcall({a:'m_convert',id:t.dataset.id,newId:n},'Converted.'); },
  addStaff:function(){ var nm=$('#a_name').value.trim(); if(!nm) return toast('Enter the name.'); mcall({a:'m_add',name:nm,id:$('#a_id').value.trim(),pos:$('#a_pos').value.trim(),dept:$('#a_dept').value,unit:$('#a_unit').value.trim()},'Added.',function(r){ toast('Added with ID '+r.id); }); },
  rosterGo:function(){ if(S.rosterRows) rosterSend(0,{add:0,upd:0,skip:0}); },
  signOpen:function(t){ signModal(t.dataset.id); },
  signSave:function(t){ var nm=$('#g_name').value.trim(); if(!nm) return toast('Enter your name.'); var items=$$('#g_items input:checked').map(function(i){return i.value;});
    api({a:'m_signoff',pin:S.pin,id:t.dataset.id,signer:nm,position:$('#g_pos').value,date:$('#g_dt').value,method:$('#g_me').value,items:items,comment:$('#g_cm').value.trim()}).then(function(r){ if(!r.ok) return toast(errMsg(r)); toast('Sign-off saved.'); $('#modal').innerHTML=''; S.soList=null; if(S.role==='master') mLoad(); else render(); }); },
  saveSettings:function(){ var v=function(i){return $(i).value;}, cfg={hospital:v('#s_hosp').trim(),formTitle:v('#s_form').trim(),passMark:Math.min(100,Math.max(50,Number(v('#s_pass'))||75)),minWatch:Math.max(0,Number(v('#s_min'))||0),videoUrl:v('#s_vid').trim(),signName:v('#s_sign').trim(),signTitle:v('#s_title').trim(),safetyLoc:v('#s_loc').trim(),validMonths:Math.max(1,Number(v('#s_valid'))||12),appUrl:v('#s_url').trim(),requireSignoff:$('#s_req').checked,depts:v('#s_dept').split('\n').map(function(x){return x.trim();}).filter(Boolean)};
    var send=function(){ api({a:'m_cfg',pin:S.pin,cfg:cfg}).then(function(r){ if(!r.ok) return toast(errMsg(r)); S.cfg=r.cfg; toast('Settings saved.'); mLoad(); }); }; var f=$('#s_logo').files[0]; if(f) resizeLogo(f,function(u){ cfg.logo=u; send(); }); else send(); },
  exportX:exportX, exportCSV:exportCSV, exportPDF:exportPDF, qrPoster:qrPoster,
  demo:function(){ mcall({a:'m_demo',n:50},'Sample data loaded. It is marked and can be removed.'); },
  undemo:function(){ mcall({a:'m_undemo'},'Sample data removed.'); },
  backup:function(){ download(new Blob([LocalStore.dump()],{type:'application/json'}),'CodeRed_pilot_backup_'+todayISO()+'.json'); }
};
document.addEventListener('click',function(e){ var t=e.target.closest('[data-act]'); if(!t) return; var f=A[t.dataset.act]; if(!f) return; if(t.dataset.act==='mclose'&&!t.classList.contains('btn')&&e.target.closest('.modal')) return; f(t,e); });
document.addEventListener('submit',function(e){ e.preventDefault();
  if(e.target.id==='startForm') doLogin();
  if(e.target.id==='loginForm'){ var kind=e.target.dataset.k, pin=$('#pin').value; api({a:'m_login',pin:pin}).then(function(r){ if(!r.ok||(kind==='master'&&r.role!=='master')){ toast(r.ok?'That PIN is for sign-off only.':errMsg(r)); $('#pin').value=''; return; } S.role=r.role; S.pin=pin; S.soList=null; if(kind==='master') mLoad(); else render(); }); } });
document.addEventListener('input',function(e){ var id=e.target.id; if(id==='sq'||id==='sgq'){ if(id==='sq') S.q=e.target.value; else S.so.q=e.target.value; var p=e.target.selectionStart; render(); var n=$('#'+id); if(n){ n.focus(); n.setSelectionRange(p,p); } } });
document.addEventListener('change',function(e){ var id=e.target.id;
  if(id==='rep_m'||id==='rep_y'){ if(e.target.value){ S.repVal=e.target.value; render(); } }
  if(id==='sd'){ S.fd=e.target.value; render(); } if(id==='ss'){ S.fs=e.target.value; render(); }
  if(id==='f_noid'){ var on=e.target.checked, f=$('#f_id'); f.disabled=on; f.required=!on; if(on) f.value=''; $('#noidh').style.display=on?'block':'none'; }
  if(id==='f_shared'){ S.shared=e.target.checked; $('#sharedh').style.display=S.shared?'block':'none'; }
  if(id==='rosterF'&&e.target.files[0]) parseRoster(e.target.files[0]);
  if(id==='restoreF'&&e.target.files[0]){ var fr=new FileReader(); fr.onload=function(){ try{ LocalStore.load(fr.result); toast('Backup restored.'); mLoad(); }catch(x){ toast('That file is not a valid backup.'); } }; fr.readAsText(e.target.files[0]); }
  if(id==='f_id'){ var v=e.target.value.trim(); if(v&&!$('#f_name').value) api({a:'lookup',id:v}).then(function(r){ if(r.ok&&r.found){ if(!$('#f_name').value) $('#f_name').value=r.name; if(!$('#f_unit').value) $('#f_unit').value=r.unit||''; if(r.start){ $('#f_start').value=r.start; } var d=$('#f_dept'); if(r.dept&&!d.value) d.value=r.dept; } }); } });
applyLang(); boot();
